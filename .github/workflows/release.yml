# Builds the Windows installers and attaches them to a *draft* GitHub Release.
# You then review the draft on GitHub (Releases) and click "Publish release".
#
# Two ways to start it (see docs/RELEASING.md):
#   - push a tag like v0.2.0                       (git tag v0.2.0 && git push origin v0.2.0)
#   - GitHub -> Actions -> Release -> "Run workflow" (tags the current version for you)
# Either way the version comes from src-tauri/tauri.conf.json, so bump it first.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the tag and the draft release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Windows release
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Check version and tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag="v${version}"
          echo "App version in tauri.conf.json: ${version}"
          if [ "$EVENT" = "push" ]; then
            if [ "$REF_NAME" != "$tag" ]; then
              echo "::error::Tag ${REF_NAME} doesn't match the app version ${version} in src-tauri/tauri.conf.json. Set the version to ${REF_NAME#v} in package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json, commit, then delete and re-push the tag."
              exit 1
            fi
          else
            if [ "$REF_TYPE" != "branch" ]; then
              echo "::error::Run this workflow from a branch (normally main), not a tag."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
              if gh release view "$tag" >/dev/null 2>&1; then
                echo "::error::Release ${tag} already exists. Bump the version in package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json first."
                exit 1
              fi
              # Leftover tag from a cancelled/failed run (no release): move it to this commit.
              echo "Tag ${tag} exists without a release: moving it to $(git rev-parse --short HEAD)."
              git tag -f "$tag"
              git push -f origin "refs/tags/${tag}"
            else
              git tag "$tag"
              git push origin "refs/tags/${tag}"
            fi
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm packages
        run: npm ci

      # Portable app only (owner doesn't want installers).
      - name: Build portable app
        run: npx tauri build --ci --no-bundle

      - name: Publish release with the portable .exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          exe="ChampSelectHelper-${TAG}-portable.exe"
          cp src-tauri/target/release/champ-select-helper.exe "$exe"
          cat > notes.md <<'NOTES'
          **Download `ChampSelectHelper-…-portable.exe` below and double-click it.** No install needed.

          Windows may show "Windows protected your PC" because the app isn't code-signed:
          click **More info** -> **Run anyway**. Needs Microsoft Edge WebView2 (already on Windows 10/11).

          Champ Select Helper isn't endorsed by Riot Games and doesn't reflect the views or opinions of Riot Games or anyone officially involved in producing or managing Riot Games properties. Riot Games, and all associated properties are trademarks or registered trademarks of Riot Games, Inc.
          NOTES
          gh release create "$TAG" "$exe" --title "Champ Select Helper ${TAG}" --notes-file notes.md --latest
