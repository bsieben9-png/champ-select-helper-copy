# Checks the code and builds the Windows app on every push to main and every
# pull request. To download the app: GitHub -> Actions -> pick a run ->
# "Artifacts" at the bottom of the page (see README.md).
name: Build

on:
  push:
    branches: [main]
    # Text-only changes (README, docs, CLAUDE.md notes) don't need a new build.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch: # "Run workflow" button on the Actions tab

# A newer push to the same branch cancels the older, still-running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Checks & tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm packages
        run: npm ci

      # The checks below use `!cancelled()` so every one of them reports its
      # own result, even if an earlier one failed.
      - name: Type-check UI (svelte-check)
        if: ${{ !cancelled() }}
        run: npm run check

      - name: Build UI
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Rust tests
        if: ${{ !cancelled() }}
        working-directory: src-tauri
        run: cargo test

      # Advisory only: lint warnings show up as a yellow "!" on the step but
      # don't fail the build.
      - name: Clippy (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  windows:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm packages
        run: npm ci

      # Compiles the app (release mode) and makes the NSIS "-setup.exe"
      # installer. This is the one that must succeed.
      - name: Build app + setup.exe installer
        run: npx tauri build --ci --bundles nsis

      # The .msi (WiX) is a nice-to-have: if WiX ever breaks on GitHub's
      # Windows image, we still get the setup.exe and the portable .exe.
      - name: Build .msi installer (optional)
        continue-on-error: true
        run: npx tauri bundle --ci --bundles msi

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: champ-select-helper-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      # The bare program, no installer: download and double-click.
      # (Needs Microsoft Edge WebView2, which Windows 10/11 already have.)
      - name: Prepare portable .exe
        run: cp src-tauri/target/release/champ-select-helper.exe champ-select-helper-portable.exe

      - name: Upload portable .exe
        uses: actions/upload-artifact@v7
        with:
          # archive: false uploads the file itself (no zip); the artifact is
          # then named after the file: "champ-select-helper-portable.exe".
          path: champ-select-helper-portable.exe
          archive: false
          if-no-files-found: error
          retention-days: 14
