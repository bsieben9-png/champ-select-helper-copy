# Builds the Windows installers and attaches them to a *draft* GitHub Release.
# You then review the draft on GitHub (Releases) and click "Publish release".
#
# Two ways to start it (see docs/RELEASING.md):
#   - push a tag like v0.2.0                       (git tag v0.2.0 && git push origin v0.2.0)
#   - GitHub -> Actions -> Release -> "Run workflow" (tags the current version for you)
# Either way the version comes from src-tauri/tauri.conf.json, so bump it first.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the tag and the draft release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Windows release
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Check version and tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag="v${version}"
          echo "App version in tauri.conf.json: ${version}"
          if [ "$EVENT" = "push" ]; then
            if [ "$REF_NAME" != "$tag" ]; then
              echo "::error::Tag ${REF_NAME} doesn't match the app version ${version} in src-tauri/tauri.conf.json. Set the version to ${REF_NAME#v} in package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json, commit, then delete and re-push the tag."
              exit 1
            fi
          else
            if [ "$REF_TYPE" != "branch" ]; then
              echo "::error::Run this workflow from a branch (normally main), not a tag."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
              echo "::error::Tag ${tag} already exists. Bump the version in package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json first."
              exit 1
            fi
            # Create the tag here (not via the release) so publishing the
            # draft later doesn't start this workflow a second time.
            git tag "$tag"
            git push origin "refs/tags/${tag}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm packages
        run: npm ci

      - name: Build installers and create draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: Champ Select Helper ${{ steps.version.outputs.tag }}
          releaseBody: |
            **Which file?**
            - the file ending in **`_x64-setup.exe`**: the installer (recommended)
            - the **`.msi`**: the same app as a Windows Installer package
            - the other **`.exe`**: portable version, no install needed, just run it

            Windows may show "Windows protected your PC" because the app isn't code-signed:
            click **More info** -> **Run anyway**.

            Champ Select Helper isn't endorsed by Riot Games and doesn't reflect the views or opinions of Riot Games or anyone officially involved in producing or managing Riot Games properties. Riot Games, and all associated properties are trademarks or registered trademarks of Riot Games, Inc.
          releaseDraft: true
          prerelease: false
          uploadPlainBinary: true
          uploadUpdaterJson: false
