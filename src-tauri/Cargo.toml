[package]
name = "champ-select-helper"
version = "0.1.2"
description = "League of Legends champ select helper: runes, items, spells and counters"
edition = "2021"
publish = false

[lib]
name = "champ_select_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "fs", "macros", "rt-multi-thread"] }
# rustls with both the bundled webpki roots and the OS trust store (corporate
# proxies / antivirus that intercept TLS install their CA in the OS store).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "gzip"] }
anyhow = "1"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# Mock runtime (`tauri::test`) for driving the watcher in tests.
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
